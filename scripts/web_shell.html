<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1712"><title>Border Guardian Bangladesh — Playtest</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#08120f;color:#e7ecdf;font-family:system-ui,sans-serif;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#loader{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#253e2c,#08120f 80%);z-index:10}.card{width:min(490px,100%);text-align:center}.eyebrow{color:#b8c89e;font-size:12px;letter-spacing:.25em}h1{font-size:clamp(25px,5vw,42px);line-height:1.1;margin:18px 0;color:#eddfad}p{font-size:15px;line-height:1.7;color:#c6cfbf}button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:15px 26px;background:#e2ce8d;color:#142416;cursor:pointer;margin:12px 5px}button:disabled{opacity:.5}progress{width:100%;height:13px;accent-color:#d3bc7b;margin:15px 0}#detail{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;max-height:25vh;overflow:auto;color:#c5cfbf}#retry{display:none}.fine{font-size:11px;color:#8d9e8a}#rotate{display:none;position:fixed;bottom:5px;left:0;right:0;text-align:center;color:#eddfad;pointer-events:none;font-size:12px;z-index:11}@media(orientation:portrait){#rotate{display:block}}
</style></head><body><canvas id="canvas" tabindex="0" aria-label="Border Guardian Bangladesh 3D game"></canvas><div id="loader"><div class="card"><div class="eyebrow">PLAYTEST • 0.4.0</div><h1>BORDER GUARDIAN<br>BANGLADESH</h1><p>সিলেট-অনুপ্রাণিত পরিবেশ • 3D Rafi • Offline Bot Match<br>ফোন আড়াআড়ি করে খেলুন · Use landscape</p><button id="start">খেলা চালু করুন · Play</button><progress id="progress" max="100" value="0" hidden></progress><p id="stage">প্রথমবার প্রায় __DOWNLOAD_MB__ MB ডাউনলোড হবে।</p><div id="detail"></div><button id="retry">আবার চেষ্টা · Retry</button><p class="fine">Fictional game • No government affiliation<br>Build __REV__</p></div></div><div id="rotate">ফোন আড়াআড়ি করুন · Rotate to landscape</div><script>
const config=__CONFIG__;
const stage=document.getElementById('stage'),detail=document.getElementById('detail'),progress=document.getElementById('progress');
let started=false,ready=false,failed=false,lastUpdate=Date.now();
window.bgbStage=function(text){if(!failed){stage.textContent=text;lastUpdate=Date.now();}};
window.bgbProgress=function(current,total){if(failed)return;lastUpdate=Date.now();progress.hidden=false;progress.value=Math.min(95,current/total*95);stage.textContent='ডাউনলোড হচ্ছে · '+(current/1048576).toFixed(1)+' / '+(total/1048576).toFixed(1)+' MB';};
window.bgbFail=function(error){if(ready||failed)return;failed=true;document.getElementById('loader').style.display='grid';stage.textContent='গেম চালু হয়নি · Could not start game';detail.textContent=String(error?.message||error||'Unknown startup error');document.getElementById('retry').style.display='inline-block';progress.hidden=true;};
window.addEventListener('error',e=>window.bgbFail(e.error||e.message));
window.addEventListener('unhandledrejection',e=>window.bgbFail(e.reason));
document.getElementById('retry').onclick=()=>location.reload();
setInterval(()=>{if(started&&!ready&&!failed&&Date.now()-lastUpdate>60000){window.bgbFail('Loading timed out at: '+stage.textContent+'\nআবার চেষ্টা চাপুন। এই লেখা থাকলে screenshot পাঠান।');}},2000);
document.getElementById('start').onclick=async function(){if(started)return;started=true;this.disabled=true;this.hidden=true;progress.hidden=false;window.bgbStage('ইঞ্জিন লোড হচ্ছে · Loading engine');try{
 const script=document.createElement('script');script.src='index.js?v=__REV__';await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=()=>reject(new Error('Could not download game loader'));document.head.appendChild(script);});
 const missing=Engine.getMissingFeatures({threads:false});if(missing.length)throw new Error(missing.join('\n'));
 const engine=new Engine({...config,onPrint:(...args)=>console.log(...args),onPrintError:(...args)=>{console.error(...args);if(args.join(' ').includes('SCRIPT ERROR:'))window.bgbFail(args.join(' '));}});
 await engine.startGame();if(failed)return;ready=true;document.getElementById('loader').remove();document.getElementById('canvas').focus();
}catch(error){window.bgbFail(error);}};
</script></body></html>
