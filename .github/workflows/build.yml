name: Godot Web and Android Debug
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install official Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          echo /tmp/godot >> "$GITHUB_PATH"
          ln -s /tmp/godot/Godot* /tmp/godot/godot
          curl -fsSL "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$target"
          unzip -oj /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/android_source.zip templates/web_nothreads_release.zip -d "$target"
      - name: Configure Android debug export
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build dist
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<CFG
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          CFG
      - name: Import and test
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --quit 2>&1 | tee build/import.log
          ! grep -E '^SCRIPT ERROR:|^ERROR:' build/import.log
          XDG_DATA_HOME=/tmp/bgb-smoke timeout 60 godot --headless -- --smoke 2>&1 | tee build/smoke.log
          grep 'SMOKE PASS' build/smoke.log
          XDG_DATA_HOME=/tmp/bgb-physics timeout 60 godot --headless -- --physics-test 2>&1 | tee build/physics.log
          grep 'PHYSICS PASS' build/physics.log
          timeout 60 godot --headless --script tests/terrain_check.gd 2>&1 | tee build/terrain.log
          grep 'TERRAIN PASS' build/terrain.log
          timeout 60 godot --headless --script tests/combat_check.gd 2>&1 | tee build/combat.log
          grep 'COMBAT PASS' build/combat.log
      - name: Build Android APK and verify signature
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --export-debug Android build/bgb-border-guardian-debug.apk 2>&1 | tee build/android.log
          test -s build/bgb-border-guardian-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/bgb-border-guardian-debug.apk
          sha256sum build/bgb-border-guardian-debug.apk > build/SHA256SUMS
      - name: Build browser game
        run: |
          godot --headless --export-release Web dist/index.html
          python3 scripts/package_web.py
          node tests/web_loader.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: bgb-android-debug
          path: |
            build/*.apk
            build/SHA256SUMS
            build/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: bgb-playable-web
          path: dist/
